<html lang="es">
<head>

<title>Letra a Letra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Una columna. Arriba contadores y pestañas; la tarjeta muestra una letra grande, la definición y un campo para escribir la palabra. */
:root {
  --bg: #F3F4F8; --surface: #FFFFFF; --surface-2: #EDEFF5; --fg: #12151C; --muted: #5A6174; --line: #DADDE6;
  --accent: #2457E6; --accent-fg: #FFFFFF; --accent-soft: #DCE8FB;
  --ok: #1D6A39; --ok-bg: #DDF3E4; --bad: #A12A1E; --bad-bg: #FBE1DE;
  --hard-bg: #FBEBCB; --hard-fg: #86570A; --easy-bg: #DCE8FB; --easy-fg: #1D4F9C;
  --learn: #A12A1E; --young: #1D4F9C; --mature: #1D6A39;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F121A; --surface: #171B26; --surface-2: #1F2433; --fg: #E8EBF3; --muted: #9AA2B5; --line: #2A3042;
    --accent: #7195FF; --accent-fg: #0B1020; --accent-soft: #16284A;
    --ok: #84D69C; --ok-bg: #16301F; --bad: #FF9E92; --bad-bg: #3C1A17;
    --hard-bg: #3A2B0B; --hard-fg: #F2C66E; --easy-bg: #16284A; --easy-fg: #92B7FF;
    --learn: #FF9E92; --young: #92B7FF; --mature: #84D69C;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, textarea, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; margin: 0; }
.brand span { color: var(--accent); }
.counts { display: flex; gap: 14px; font-variant-numeric: tabular-nums; font-size: 15px; }
.counts span { display: inline-flex; gap: 5px; align-items: baseline; color: var(--muted); }
.counts b { font-size: 17px; }
.counts .c-new b { color: var(--young); } .counts .c-learn b { color: var(--learn); } .counts .c-rev b { color: var(--mature); }
.counts .on { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; color: var(--fg); }
.acct { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 500; color: var(--muted); }
.acct.on { color: var(--ok); border-color: var(--ok); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; margin-bottom: -1px; color: var(--muted); font-weight: 600; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

.filter { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.topic { align-self: center; margin-top: -8px; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 600; }
.row .tp { font-size: 12px; color: var(--muted); }
.tlist { display: flex; flex-direction: column; gap: 10px; }
.tl { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.tl .tt { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 600; }
.tl .tt small { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.form select { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
.filter select { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 600; color: var(--fg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; display: flex; flex-direction: column; gap: 18px; }
.letter { align-self: center; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-fg); font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: 1;
  box-shadow: 0 0 0 6px var(--accent-soft); }
.letter.ok { background: var(--ok); box-shadow: 0 0 0 6px var(--ok-bg); color: var(--surface); }
.letter.bad { background: var(--bad); box-shadow: 0 0 0 6px var(--bad-bg); color: var(--surface); }
.def { font-family: var(--font-display); font-weight: 600; font-size: 23px; line-height: 1.25; text-align: center; margin: 0; text-wrap: balance; }
.tag { align-self: center; font-size: 13px; color: var(--muted); margin-top: -10px; }
.ansrow { display: flex; gap: 8px; }
.ansrow input { flex: 1; min-width: 0; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px;
  font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.ansrow input:focus { border-color: var(--accent); outline: none; }
.btn-main { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; font-size: 17px; }
.btn-main.full { width: 100%; }
.btn-link { align-self: center; background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 15px; padding: 2px 6px; }
.btn-ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; color: var(--fg); font-weight: 500; }
.btn-ghost.sm { padding: 6px 12px; font-size: 14px; }
.btn-danger { background: var(--bad-bg); color: var(--bad); border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 600; }

.verdict { text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.verdict .v { font-weight: 700; font-size: 17px; }
.verdict .v.ok { color: var(--ok); } .verdict .v.bad { color: var(--bad); }
.word { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: 0.02em; line-height: 1.1; overflow-wrap: anywhere; }
.typed { color: var(--bad); text-decoration: line-through; font-weight: 600; overflow-wrap: anywhere; }
.alts { color: var(--muted); font-size: 14px; }
.rate { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rate.one { grid-template-columns: 1fr; }
.rb { border: 0; border-radius: 12px; padding: 10px 4px 11px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-weight: 600; font-size: 16px; }
.rb small { font-size: 12px; font-weight: 500; opacity: 0.85; font-variant-numeric: tabular-nums; }
.rb.r1 { background: var(--bad-bg); color: var(--bad); }
.rb.r2 { background: var(--hard-bg); color: var(--hard-fg); }
.rb.r3 { background: var(--ok-bg); color: var(--ok); }
.rb.r4 { background: var(--easy-bg); color: var(--easy-fg); }
.hint { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }
.undo { align-self: center; background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 14px; }

.done { text-align: center; align-items: center; padding: 36px 20px; }
.done h2 { font-family: var(--font-display); font-size: 28px; margin: 0; letter-spacing: -0.02em; }
.done p { margin: 0; color: var(--muted); max-width: 44ch; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.stat b { display: block; font-family: var(--font-display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { font-family: var(--font-display); font-size: 18px; margin: 0; }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); }
.stack i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 10px; }
.lg { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.lg .ring { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--mature) calc(var(--p) * 1%), var(--young) 0 calc(var(--q) * 1%), var(--surface-2) 0); }
.lg .ring b { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; }
.lg small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 110px; }
.bar { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 3px; }
.bar .col { width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 2px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.bar .col i { display: block; background: var(--mature); width: 100%; }
.bar .v { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1; }
.axis { display: flex; gap: 4px; }
.axis span { flex: 1; min-width: 0; text-align: center; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis span.today { color: var(--fg); font-weight: 700; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.setrow input[type="number"] { width: 80px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
.sync { color: var(--muted); font-size: 13px; margin: 0; }
.acct-row { display: flex; gap: 8px; }
.acct-row input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.panel ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.panel a { color: var(--accent); }
.err { color: var(--bad); font-size: 14px; margin: 0; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.search { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
.row { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .l { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--accent); }
.row .w { font-weight: 700; }
.row .w.hid { color: var(--muted); letter-spacing: 0.2em; font-weight: 500; }
.row .d { color: var(--muted); font-size: 14px; line-height: 1.35; }
.row .st { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
.row .x { background: none; border: 0; color: var(--bad); font-size: 13px; text-decoration: underline; padding: 0; display: block; margin-left: auto; }
details.add { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 20px; }
details.add summary { cursor: pointer; font-weight: 600; }
.form { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 500; }
.form input, .form textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
.form textarea { min-height: 70px; resize: vertical; }
@media (max-width: 380px) { .def { font-size: 20px; } .letter { width: 84px; height: 84px; font-size: 46px; } }
@media (prefers-reduced-motion: no-preference) { .card { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="words.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- Utilidades ---------- */
  var MIN = 60000, DAY = 86400000;
  var LETTERS = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
  function esc(x) { return String(x).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function dayNum(ts) { return Math.floor((ts - new Date(ts).getTimezoneOffset() * MIN) / DAY); }
  // Mayúsculas, sin tildes ni espacios; la Ñ se conserva.
  function norm(s) {
    return String(s).toUpperCase().replace(/Ñ/g, "\u0001").normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/\u0001/g, "Ñ").replace(/[^A-ZÑ]/g, "");
  }
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 1) return 9;
    var p = [], i, j;
    for (j = 0; j <= b.length; j++) p[j] = j;
    for (i = 1; i <= a.length; i++) {
      var prev = p[0]; p[0] = i;
      for (j = 1; j <= b.length; j++) { var t = p[j]; p[j] = Math.min(p[j] + 1, p[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
    }
    return p[b.length];
  }

  /* ---------- Mazo ---------- */
  var TOPICS = window.TOPICS || {}, TKEYS = Object.keys(TOPICS);
  function tname(t) { return TOPICS[t] || "Mis palabras"; }
  function mk(id, l, w, d, t) { var alts = w.split("/").map(function (x) { return x.trim(); }).filter(Boolean); return { id: id, l: l, w: alts[0], alts: alts, d: d, t: t || "mine" }; }
  var usedIds = {};
  var BUILTIN = (window.WORDS || []).map(function (e) {
    var id = norm(e[1].split("/")[0]);
    while (usedIds[id]) id += "2";
    usedIds[id] = 1;
    return mk(id, e[0], e[1], e[2], e[3]);
  });

  /* ---------- Estado y guardado ---------- */
  var LS = "letra-a-letra:v1";
  function fresh() { return { cards: {}, custom: [], cfg: { newPerDay: 20, letra: "", tema: "" }, daily: { day: 0, newDone: 0 }, log: {}, savedAt: 0 }; }
  function normS(r) { var o = Object.assign(fresh(), r || {}); o.cfg = Object.assign({ newPerDay: 20, letra: "", tema: "" }, o.cfg); return o; }
  var S = fresh();
  try { var raw = localStorage.getItem(LS); if (raw) S = normS(JSON.parse(raw)); } catch (err) {}

  /* ---------- Sesión con GitHub (gist privado) ---------- */
  var GK = "letra-a-letra:gh", GIST_DESC = "Letra a Letra - progreso", GIST_FILE = "letra-a-letra.json";
  var gh = { token: "", user: "", gist: "" };
  try { var gr = localStorage.getItem(GK); if (gr) gh = Object.assign(gh, JSON.parse(gr)); } catch (err) {}
  var syncMsg = "", ghErr = "", ghBusy = false, wtimer = null, writing = false, pending = false;
  function ghSave() { try { localStorage.setItem(GK, JSON.stringify(gh)); } catch (err) {} }
  function api(path, method, body) {
    var hd = { "Authorization": "Bearer " + gh.token, "Accept": "application/vnd.github+json" };
    if (body) hd["Content-Type"] = "application/json";
    return fetch("https://api.github.com" + path, { method: method || "GET", headers: hd, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { if (!r.ok) { var e = new Error("http " + r.status); e.status = r.status; throw e; } return r.json(); });
  }
  function failMsg(err) { return err && err.status === 401 ? "GitHub ya no acepta el token. Volvé a conectar la cuenta." : "No se pudo sincronizar. Tu progreso sigue guardado en este navegador."; }
  function note() { var n = document.getElementById("syncnote"); if (n) n.textContent = syncMsg; }
  function save() {
    S.savedAt = Date.now();
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch (err) {}
    if (gh.token && gh.gist) { clearTimeout(wtimer); wtimer = setTimeout(push, 1500); }
  }
  async function push() {
    if (writing) { pending = true; return; }
    writing = true;
    try { var files = {}; files[GIST_FILE] = { content: JSON.stringify(S) }; await api("/gists/" + gh.gist, "PATCH", { files: files }); syncMsg = "Guardado en tu cuenta de GitHub."; }
    catch (err) { syncMsg = failMsg(err); }
    writing = false; note();
    if (pending) { pending = false; push(); }
  }
  async function pull() {
    var g = await api("/gists/" + gh.gist), f = g.files && g.files[GIST_FILE];
    if (!f || !f.content) { push(); return; }
    var remote = normS(JSON.parse(f.content));
    if ((remote.savedAt || 0) > (S.savedAt || 0)) {
      S = remote; try { localStorage.setItem(LS, JSON.stringify(S)); } catch (err) {}
      rebuild();
      cur = null; phase = "ask"; typed = ""; result = null;
    } else if ((S.savedAt || 0) > (remote.savedAt || 0)) push();
  }
  async function connect(token) {
    token = (token || "").trim();
    if (!token) { ghErr = "Pegá el token que creaste en GitHub."; render(); return; }
    ghErr = ""; ghBusy = true; render();
    try {
      gh = { token: token, user: "", gist: "" };
      var me = await api("/user"); gh.user = me.login;
      var found = null;
      for (var page = 1; page <= 3 && !found; page++) {
        var list = await api("/gists?per_page=100&page=" + page);
        found = list.filter(function (g) { return g.description === GIST_DESC && g.files && g.files[GIST_FILE]; })[0];
        if (list.length < 100) break;
      }
      if (found) { gh.gist = found.id; await pull(); }
      else { var files = {}; files[GIST_FILE] = { content: JSON.stringify(S) }; var g = await api("/gists", "POST", { description: GIST_DESC, public: false, files: files }); gh.gist = g.id; }
      ghSave(); syncMsg = "Conectado como " + gh.user + ". Tu progreso se guarda en tu cuenta.";
    } catch (err) {
      gh = { token: "", user: "", gist: "" }; ghSave();
      ghErr = err.status === 401 ? "GitHub no aceptó el token. Revisá que lo hayas copiado completo."
        : err.status === 403 || err.status === 404 ? "El token no tiene permiso para gists. Creá uno nuevo con el permiso gist marcado."
        : "No se pudo conectar con GitHub. Probá de nuevo en un momento.";
    }
    ghBusy = false; render();
  }
  function disconnect() { gh = { token: "", user: "", gist: "" }; ghSave(); syncMsg = ""; ghErr = ""; render(); }
  async function startupPull() {
    if (!gh.token || !gh.gist) return;
    try { await pull(); syncMsg = "Conectado como " + gh.user + ". Tu progreso se guarda en tu cuenta."; render(); }
    catch (err) { syncMsg = failMsg(err); note(); }
  }
  function exportJson() {
    var blob = new Blob([JSON.stringify(S)], { type: "application/json" }), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "letra-a-letra-progreso.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function importJson(file) {
    var r = new FileReader();
    r.onload = function () {
      try { S = normS(JSON.parse(r.result)); rebuild(); save(); cur = null; phase = "ask"; ghErr = ""; syncMsg = "Progreso importado."; }
      catch (err) { ghErr = "Ese archivo no es una copia de seguridad válida."; }
      render();
    };
    r.readAsText(file);
  }

  /* ---------- Tarjetas ---------- */
  var byId = {}, ORDER = [];
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function rebuild() {
    byId = {};
    var all = BUILTIN.concat(S.custom.map(function (c) { return mk(c.id, c.l, c.w, c.d, c.t); }));
    all.forEach(function (d) { byId[d.id] = d; });
    // Orden aleatorio. La semilla se guarda con el progreso, así el orden es el mismo en todos tus dispositivos.
    if (!S.cfg.seed) S.cfg.seed = Math.floor(Math.random() * 2147483647) + 1;
    var rnd = mulberry(S.cfg.seed);
    ORDER = all.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    for (var i = ORDER.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = ORDER[i]; ORDER[i] = ORDER[j]; ORDER[j] = t; }
    ORDER.forEach(function (d, i) { d.r = i; });
  }
  rebuild();

    var t = ev.target.closest("[data-tab],[data-act],[data-rate],[data-del],[data-letter],[data-topic]");
    if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.rate) { rate(+t.dataset.rate); return; }
    if (t.dataset.topic) { S.cfg.tema = t.dataset.topic; S.cfg.letra = ""; cur = null; save(); tab = "study"; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.letter) { S.cfg.letra = t.dataset.letter; cur = null; save(); tab = "study"; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.del) { S.custom = S.custom.filter(function (d) { return d.id !== t.dataset.del; }); delete S.cards[t.dataset.del]; if (cur === t.dataset.del) cur = null; rebuild(); save(); render(); return; }
    var a = t.dataset.act;
    if (a === "skip") check(true);
    else if (a === "typo") { typo = true; render(); }
    else if (a === "undo") doUndo();
    else if (a === "ahead") { ahead = true; cur = null; render(); }
    else if (a === "more") { ensureDaily(); S.daily.newDone = Math.max(0, S.daily.newDone - 10); if (S.daily.newDone === 0 && S.cfg.newPerDay === 0) S.cfg.newPerDay = 10; save(); render(); }
    else if (a === "deckmore") { deckLimit += 300; render(); }
    else if (a === "gh-in") connect((document.getElementById("gh-token") || {}).value);
    else if (a === "gh-out") disconnect();
    else if (a === "export") exportJson();
    else if (a === "import") document.getElementById("imp").click();
    else if (a === "reset") { confirmReset = true; render(); }
    else if (a === "reset-no") { confirmReset = false; render(); }
    else if (a === "reset-yes") { var cfg = S.cfg, custom = S.custom; S = fresh(); S.cfg = cfg; S.cfg.seed = 0; S.custom = custom; rebuild(); confirmReset = false; cur = null; phase = "ask"; undo = null; save(); render(); }
  });
  app.addEventListener("change", function (ev) {
    var id = ev.target.id;
    if (id === "imp" && ev.target.files[0]) { importJson(ev.target.files[0]); return; }
    if (id === "npd") { S.cfg.newPerDay = Math.max(0, Math.min(200, parseInt(ev.target.value, 10) || 0)); save(); render(); }
    if (id === "flt") { S.cfg.letra = ev.target.value; cur = null; save(); render(); }
    if (id === "tflt") { S.cfg.tema = ev.target.value; cur = null; save(); render(); }
    if (id === "dtflt") { deckTopic = ev.target.value; deckLimit = 150; render(); }
    if (id === "dflt") { deckLetter = ev.target.value; deckLimit = 150; render(); }
  });
  app.addEventListener("input", function (ev) {
    if (ev.target.id === "ans") typed = ev.target.value;
    if (ev.target.id === "q") {
      q = ev.target.value; deckLimit = 150; var pos = ev.target.selectionStart; render();
      var s = document.getElementById("q"); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (e) {} }
    }
  });
  app.addEventListener("keydown", function (ev) {
    if (ev.target.id === "gh-token" && ev.key === "Enter") { ev.preventDefault(); connect(ev.target.value); }
  });
  app.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (ev.target.id === "ansform") { check(false); return; }
    if (ev.target.id !== "addform") return;
    var w = document.getElementById("f-w").value.trim(), d = document.getElementById("f-d").value.trim();
    var first = norm(w.split("/")[0]);
    if (!first) { formErr = "Escribí la palabra."; render(); return; }
    if (!d) { formErr = "Escribí la definición."; render(); return; }
    if (LETTERS.indexOf(first[0]) < 0) { formErr = "La palabra tiene que empezar con una letra."; render(); return; }
    if (byId[first]) { formErr = "Esa palabra ya está en el juego."; render(); return; }
    formErr = "";
    S.custom.push({ id: "u_" + first, l: first[0], w: w.toUpperCase(), d: d, t: (document.getElementById("f-t") || {}).value || "mine" });
    rebuild(); save(); render();
  });
  document.addEventListener("keydown", function (ev) {
    if (tab !== "study" || !cur || phase !== "result") return;
    var tag = ev.target && ev.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if (ev.key === "Enter" || ev.key === " ") {
      if (tag === "BUTTON") return;
      ev.preventDefault();
      rate(result.ok || typo ? 3 : 1);
    } else if ((result.ok || typo) && "234".indexOf(ev.key) > -1 && ev.key) rate(+ev.key);
  });
  setInterval(function () { if (tab === "study" && !cur) render(); }, 10000);

  render();
  startupPull();
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && phase === "ask" && !typed) startupPull(); });
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
